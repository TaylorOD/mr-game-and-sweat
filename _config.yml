title: 'Mr. Game and Sweat'
email: mrgameandsweat@gmail.com
timezone: UTC
baseurl: ''
url: 'https://mrgameandsweat.com'
permalink: '/:title/'
logo: 'assets/images/logos/logo-on-dark.png'
favicon: 'assets/images/favicon.ico'
author: Taylor Owen Dorsett
paginate: 30
paginate_path: /page:num/
disqus: false
locale: en_us
lang: en_us
feed_items: 10
feed_update_period: daily
feed_update_frequency: 1
markdown: kramdown
kramdown:
  syntax_highlighter_opts:
    disable: true
sass:
  sass_dir: _sass
  style: :compressed
ganalytics: G-KKMVFQ1QE2

# Authors
authors:
  taylor:
    name: Taylor Owen Dorsett
    display_name: Taylor Owen Dorsett
    avatar: 'assets/images/authors/taylor.jpg'
    email: mrgameandsweat@gmail.com
    web:
    twitter:
    description: 'Author and founder of Mr. Game and Sweat. He can be found running on a treadmill with an xbox controller in hand playing Balatro most days of the week'
  jonas:
    name: Jonas
    display_name: Jonas
    avatar: 'assets/images/authors/jonas.jpg'
    email: mrgameandsweat@gmail.com
    web:
    twitter:
    description: 'Jonas is an experienced writer and gamer. He loves Diablo IV, the NBA 2k series, and Fallout 4. He mostly games while riding his exercise bike and watching the latest sports news.'

# Social
social:
  steam: https://store.steampowered.com/curator/45035411/

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-archives
  - jekyll-redirect-from

# Chat bubble. Leave this blank to hide the bubble
chat_api_url:

# Repo files that shouldnt end up on the site
exclude:
  - README.md
  - CLAUDE.md
  - docs
  - scripts
  - test
  - lib
  - generate_reviews.js
  - steamData.json
  - package.json
  - package-lock.json
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .sass-cache
  - .jekyll-cache
