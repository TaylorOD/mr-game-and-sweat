---
layout: default
---

<!-- Post Featured Image -->
{% if page.image %}
<div class="text-center mx-auto mb-5">
	{% include image.html src=page.image alt=page.title class="featured-image text-center mx-auto rounded" sizes="183px" width=183 height=160 priority=true %}
</div>
{% endif %}
<!-- End Featured Image -->

<div class="col-lg-8 mx-auto">
	<div class="mainheading">
		<h1 class="posttitle">{{ page.title }}</h1>
	</div>

	<div class="article-post">{{content}}</div>
</div>
