name: Temp update lockfile
on:
  push:
    branches: [switch-to-haiku]
    paths: ['.github/workflows/tmp-lockfile.yml']
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install @anthropic-ai/sdk --package-lock-only --no-audit --no-fund
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m "add anthropic sdk"
          git push origin HEAD:switch-to-haiku
