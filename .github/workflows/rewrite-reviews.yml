name: Rewrite Old Reviews

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'How many reviews to rewrite, leave empty for all of them'
        default: ''

jobs:
  rewrite:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Keep going on the rewrite branch if it exists
        run: |
          if git ls-remote --exit-code --heads origin rewrite-old-reviews; then
            git checkout -B rewrite-old-reviews origin/rewrite-old-reviews
          else
            git checkout -b rewrite-old-reviews
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Rewrite reviews
        run: node scripts/rewrite_reviews.js
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LIMIT: ${{ inputs.limit }}

      - name: Check the posts
        run: node test/posts.test.js

      - name: Push to the rewrite branch for a look
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A -- _posts
          if git diff --cached --quiet; then
            echo "Nothing rewritten"
            exit 0
          fi
          git commit -m "rewrite old reviews"
          git push origin rewrite-old-reviews
