name: Generate and Publish Game Reviews

on:
  schedule:
    - cron: '7 0 */3 * *' # Runs every three days
    - cron: '17 12 * * *' # Backfills missed days until there are none left
  workflow_dispatch:
    inputs:
      backfill_count:
        description: 'How many missed days to backfill. 0 runs the normal reviews.'
        default: '0'

jobs:
  generate-reviews:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get the voice doc
        uses: actions/checkout@v4
        with:
          repository: TaylorOD/voice
          ssh-key: ${{ secrets.VOICE_DEPLOY_KEY }}
          persist-credentials: false
          path: .voice

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate reviews
        run: node generate_reviews.js
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BACKFILL_COUNT: ${{ github.event.schedule == '17 12 * * *' && '15' || inputs.backfill_count || '0' }}

      - name: Check the new posts
        run: node test/posts.test.js

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A -- _posts
          if git diff --cached --quiet; then
            echo "No new or updated reviews to publish"
            exit 0
          fi
          git commit -m "Add new game reviews"
          git pull --rebase origin main
          git push origin HEAD:main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tell search engines about new reviews
        continue-on-error: true
        run: |
          if [ "$(git log -1 --format=%s)" != "Add new game reviews" ]; then
            echo "Nothing new to send"
            exit 0
          fi
          URLS=$(git diff --name-only --diff-filter=A HEAD~1 HEAD -- _posts | sed -E 's#^_posts/[0-9]{4}-[0-9]{2}-[0-9]{2}-(.*)\.md$#https://mrgameandsweat.com/\1/#' | jq -R . | jq -s .)
          echo "$URLS"
          jq -n --argjson urls "$URLS" '{host: "mrgameandsweat.com", key: "21c8004707a78a9a3024cfb310828a10", keyLocation: "https://mrgameandsweat.com/21c8004707a78a9a3024cfb310828a10.txt", urlList: $urls}' \
            | curl -sS --max-time 30 -o /dev/null -w 'IndexNow said %{http_code}\n' -H 'Content-Type: application/json; charset=utf-8' -d @- https://api.indexnow.org/indexnow

      - name: Open an issue if this failed
        if: failure()
        run: |
          TITLE="Review publishing is failing"
          BODY="The review job failed on $(date -u +%F). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          OPEN=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number')
          if [ -n "$OPEN" ]; then
            gh issue comment "$OPEN" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --assignee "$GITHUB_REPOSITORY_OWNER"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
