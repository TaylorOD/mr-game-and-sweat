name: Site preview

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: _site
          retention-days: 7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node test/site.test.js _site
